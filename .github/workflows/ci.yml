name: CI

on:
  push:
    branches: ["codex/**", "feature/**", "fix/**"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Unit tests
        run: python -m pytest

      - name: CLI smoke test
        run: python -m novel_creator.cli --help

      - name: Init vault smoke test
        run: novelctl init-vault

      - name: Markdown/YAML lint smoke test
        run: novelctl lint

      - name: Dashboard smoke test
        run: novelctl dashboard

      - name: Publish check smoke test
        run: novelctl publish-check

      - name: Build package
        run: python -m build

      - name: Verify vault/References not committed
        run: |
          leaked=$(git ls-files -- vault/References ':!vault/References/README.md')
          if [ -n "$leaked" ]; then
            echo "ERROR: vault/References source files found in git tracking"
            echo "$leaked"
            exit 1
          else
            echo "OK: only vault/References/README.md may be tracked"
          fi
